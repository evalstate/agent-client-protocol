[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acp-skills"
version = "0.1.0"
description = "Skills Manager for Agent Client Protocol (ACP) implementations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "ACP Contributors" }
]
keywords = ["acp", "agent", "skills", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.24.0"]
requests = ["requests>=2.28.0"]
all = ["httpx>=0.24.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/anthropics/agent-client-protocol"
Documentation = "https://github.com/anthropics/agent-client-protocol"
Repository = "https://github.com/anthropics/agent-client-protocol"

[tool.hatch.build.targets.wheel]
packages = ["acp_skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
